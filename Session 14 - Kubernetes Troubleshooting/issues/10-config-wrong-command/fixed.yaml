# Fixed: correct executable name.
apiVersion: v1
kind: Pod
metadata:
  name: opac-frontend
  labels: { issue: "10" }
spec:
  containers:
    - name: web
      image: nginx:1.27-alpine
      command: ["nginx", "-g", "daemon off;"]
      resources:
        requests: { cpu: 10m, memory: 16Mi }
        limits: { cpu: 100m, memory: 64Mi }
