# kube-prometheus-stack trimmed for a laptop Minikube.
# helm install kps prometheus-community/kube-prometheus-stack -n monitoring --create-namespace \
#   -f monitoring/helm-values/kube-prometheus-stack-values.yaml
fullnameOverride: kps

# On Minikube these control-plane components listen on 127.0.0.1 inside the node and
# cannot be scraped; turning them off avoids permanently "down" targets and noisy alerts.
kubeControllerManager: { enabled: false }
kubeScheduler: { enabled: false }
kubeEtcd: { enabled: false }
kubeProxy: { enabled: false }
defaultRules:
  disabled:
    KubeControllerManagerDown: true
    KubeSchedulerDown: true
    KubeProxyDown: true
  rules:
    etcd: false
    windows: false

prometheus:
  prometheusSpec:
    scrapeInterval: 30s
    evaluationInterval: 30s
    retention: 1d
    # Pick up ServiceMonitors / PodMonitors / PrometheusRules from any namespace,
    # not only those labelled with this Helm release.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    resources:
      requests: { cpu: 100m, memory: 384Mi }
      limits: { memory: 1Gi }

alertmanager:
  alertmanagerSpec:
    resources:
      requests: { cpu: 10m, memory: 32Mi }
  config:
    route:
      receiver: "null"
      group_by: ["alertname", "namespace"]
      group_wait: 30s
      group_interval: 2m
      repeat_interval: 1h
      routes:
        # library alerts go to their own (placeholder) receiver so they are easy to spot
        - receiver: library-team
          matchers: ['team="library"']
        - receiver: "null"
          matchers: ['alertname="Watchdog"']
    receivers:
      - name: "null"
      - name: library-team
        # Real setups would add slack_configs / email_configs / webhook_configs here.

grafana:
  adminUser: admin
  adminPassword: library-lab-only   # lab value; use a Secret (admin.existingSecret) elsewhere
  defaultDashboardsTimezone: browser
  additionalDataSources:
    - name: Loki
      type: loki
      uid: loki
      access: proxy
      url: http://loki.logging.svc.cluster.local:3100
  resources:
    requests: { cpu: 50m, memory: 128Mi }

prometheus-node-exporter:
  resources:
    requests: { cpu: 10m, memory: 16Mi }

kube-state-metrics:
  resources:
    requests: { cpu: 10m, memory: 32Mi }
