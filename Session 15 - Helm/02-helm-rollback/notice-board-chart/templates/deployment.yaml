apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "notice-board.fullname" . }}
  labels:
    {{- include "notice-board.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "notice-board.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "notice-board.selectorLabels" . | nindent 8 }}
      annotations:
        # new page content -> new hash -> Pods are rolled even if nothing else changed
        checksum/page: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      containers:
        - name: nginx
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: page
              mountPath: /usr/share/nginx/html
      volumes:
        - name: page
          configMap:
            name: {{ include "notice-board.fullname" . }}
