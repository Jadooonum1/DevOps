# A single, unmanaged Pod: the smallest thing Kubernetes can run.
# Written by hand so the fields map one-to-one onto what `kubectl run` generates.
apiVersion: v1
kind: Pod
metadata:
  name: reader-web
  namespace: library
  labels:
    app: reader-web
    tier: frontend
spec:
  containers:
    - name: nginx
      image: nginx:1.27-alpine
      ports:
        - name: http
          containerPort: 80
      resources:
        requests:
          cpu: 50m
          memory: 32Mi
        limits:
          cpu: 200m
          memory: 64Mi
