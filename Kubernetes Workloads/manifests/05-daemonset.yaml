# One shelf-scanner Pod per node, the way log shippers and node agents are deployed.
# It prints the node it runs on every 30 seconds.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: shelf-scanner
  namespace: library
  labels:
    app: shelf-scanner
spec:
  selector:
    matchLabels:
      app: shelf-scanner
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: shelf-scanner
    spec:
      # also run on control-plane nodes if they are tainted (multi-node clusters)
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: scanner
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - while true; do echo "$(date -u +%FT%TZ) scanning shelves on node ${NODE_NAME}"; sleep 30; done
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests: { cpu: 5m, memory: 8Mi }
            limits: { cpu: 50m, memory: 16Mi }
