# Fixed: a loan-service backend + Service exist, and the notifier uses the correct name.
apiVersion: v1
kind: Pod
metadata:
  name: loan-service
  labels: { app: loan-service }
spec:
  containers:
    - name: loans
      image: busybox:1.36
      command: ["sh", "-c", "mkdir -p /www && echo 'overdue: 3 books' > /www/index.html && exec httpd -f -p 8080 -h /www"]
      ports:
        - containerPort: 8080
      resources:
        requests: { cpu: 10m, memory: 16Mi }
        limits: { cpu: 50m, memory: 32Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: loan-service
spec:
  selector: { app: loan-service }
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: v1
kind: Pod
metadata:
  name: overdue-notifier
  labels: { gauntlet: "true", app: overdue-notifier }
spec:
  containers:
    - name: notifier
      image: busybox:1.36
      env:
        - name: LOANS_HOST
          value: loan-service
      command: ["sh", "-c"]
      args:
        - |
          while true; do
            if nslookup "$LOANS_HOST" >/dev/null 2>&1; then
              wget -q -T 3 -O- "http://$LOANS_HOST" && echo " <- overdue list fetched"
            else
              echo "WARN cannot resolve $LOANS_HOST, skipping notifications"
            fi
            sleep 10
          done
      resources:
        requests: { cpu: 10m, memory: 16Mi }
        limits: { cpu: 50m, memory: 32Mi }
