# Status is green (Running, 0 restarts) but the app logs say it cannot resolve
# "loan-servce" - a typo, and the real Service does not exist either.
apiVersion: v1
kind: Pod
metadata:
  name: overdue-notifier
  labels: { gauntlet: "true", app: overdue-notifier }
spec:
  containers:
    - name: notifier
      image: busybox:1.36
      env:
        - name: LOANS_HOST
          value: loan-servce
      command: ["sh", "-c"]
      args:
        - |
          while true; do
            # busybox nslookup can exit 1 even on success (NXDOMAIN for another search
            # domain), so check for an answer line instead of the exit code
            if nslookup "$LOANS_HOST" 2>/dev/null | grep -q "^Name:"; then
              body=$(wget -q -T 3 -O- "http://$LOANS_HOST") && echo "$body <- overdue list fetched"
            else
              echo "WARN cannot resolve $LOANS_HOST, skipping notifications"
            fi
            sleep 10
          done
      resources:
        requests: { cpu: 10m, memory: 16Mi }
        limits: { cpu: 50m, memory: 32Mi }
