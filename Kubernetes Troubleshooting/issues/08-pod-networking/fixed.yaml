# Fixed: listen on all interfaces so the Pod IP (and therefore the Service) reaches it.
apiVersion: v1
kind: Pod
metadata:
  name: loan-service
  labels: { app: loan-service, issue: "08" }
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "mkdir -p /www && echo 'loans: 42 active' > /www/index.html && exec httpd -f -p 0.0.0.0:8080 -h /www"]
      ports:
        - containerPort: 8080
      resources:
        requests: { cpu: 10m, memory: 16Mi }
        limits: { cpu: 50m, memory: 32Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: loan-service
  labels: { issue: "08" }
spec:
  selector: { app: loan-service }
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: v1
kind: Pod
metadata:
  name: desk-client
  labels: { app: desk-client, issue: "08" }
spec:
  containers:
    - name: client
      image: busybox:1.36
      command: ["sh", "-c", "while true; do wget -q -T 3 -O- http://loan-service || echo REQUEST FAILED; sleep 5; done"]
      resources:
        requests: { cpu: 10m, memory: 16Mi }
        limits: { cpu: 50m, memory: 32Mi }
