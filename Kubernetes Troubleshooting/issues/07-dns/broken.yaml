# A target Service plus a client that looks it up every 5s.
# The client uses dnsPolicy: None with a nameserver that does not exist (TEST-NET-1),
# so every lookup times out even though CoreDNS is fine.
apiVersion: v1
kind: Pod
metadata:
  name: shelf-target
  labels: { app: shelf-target, issue: "07" }
spec:
  containers:
    - name: web
      image: nginx:1.27-alpine
      resources:
        requests: { cpu: 10m, memory: 16Mi }
        limits: { cpu: 100m, memory: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: shelf-target
  labels: { issue: "07" }
spec:
  selector: { app: shelf-target }
  ports:
    - port: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: dns-client
  labels: { issue: "07" }
spec:
  dnsPolicy: "None"
  dnsConfig:
    nameservers: ["192.0.2.53"]
    searches: ["svc.cluster.local", "cluster.local"]
  containers:
    - name: client
      image: busybox:1.36
      command: ["sh", "-c", "while true; do nslookup -timeout=2 shelf-target || echo LOOKUP FAILED; sleep 5; done"]
      resources:
        requests: { cpu: 10m, memory: 16Mi }
        limits: { cpu: 50m, memory: 32Mi }
