# ClusterIP + a fixed port opened on every node (allowed range 30000-32767).
apiVersion: v1
kind: Service
metadata:
  name: bookshelf-nodeport
  namespace: library
  labels:
    app: bookshelf
spec:
  type: NodePort
  selector:
    app: bookshelf
  ports:
    - name: web
      port: 8000
      targetPort: http
      nodePort: 30800
