# reader-web: static front end served by nginx from a ConfigMap.
apiVersion: v1
kind: ConfigMap
metadata:
  name: reader-web-html
  namespace: library
  labels:
    app: reader-web
data:
  index.html: |
    <!doctype html>
    <html>
      <head><title>Reader Web - City Central Library</title></head>
      <body>
        <h1>City Central Library</h1>
        <p>Front end served by <code>reader-web</code>.</p>
        <ul>
          <li><a href="/api/">Catalogue API info</a></li>
          <li><a href="/api/books">Book list</a></li>
        </ul>
      </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reader-web
  namespace: library
  labels:
    app: reader-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: reader-web
  template:
    metadata:
      labels:
        app: reader-web
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
              readOnly: true
          resources:
            requests: { cpu: 20m, memory: 16Mi }
            limits: { cpu: 100m, memory: 64Mi }
      volumes:
        - name: html
          configMap:
            name: reader-web-html
---
apiVersion: v1
kind: Service
metadata:
  name: reader-web
  namespace: library
  labels:
    app: reader-web
spec:
  selector:
    app: reader-web
  ports:
    - name: http
      port: 80
      targetPort: http
