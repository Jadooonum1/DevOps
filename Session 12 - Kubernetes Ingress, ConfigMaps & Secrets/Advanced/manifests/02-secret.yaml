# Credentials loan-service uses to call the payments gateway. DEMO VALUES ONLY.
# Values under `data` must be base64. They were produced with `echo -n` - without -n
# a trailing newline is encoded too (see troubleshooting/01-secret-newline).
#   echo -n 'loan-svc'            | base64  -> bG9hbi1zdmM=
#   echo -n 'demo-only-Pay2026'   | base64  -> ZGVtby1vbmx5LVBheTIwMjY=
apiVersion: v1
kind: Secret
metadata:
  name: payments-credentials
  namespace: library
type: Opaque
data:
  PAYMENTS_CLIENT_ID: bG9hbi1zdmM=
  PAYMENTS_CLIENT_SECRET: ZGVtby1vbmx5LVBheTIwMjY=
