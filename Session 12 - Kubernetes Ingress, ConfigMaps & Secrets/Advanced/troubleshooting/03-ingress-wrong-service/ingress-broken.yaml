# BROKEN: backend Service is 'catalog-service', but the Service is called 'catalog-api'.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: catalog-direct
  namespace: library
spec:
  ingressClassName: nginx
  rules:
    - host: catalog.library.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: catalog-service
                port:
                  number: 8000
