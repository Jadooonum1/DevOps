# Database credentials for catalog-api. Demo values only - in a real project this file
# would not be committed; the Secret would come from `kubectl create secret`, a sealed
# secret or an external secret store.
# stringData takes plain text; the API server stores it base64-encoded under .data.
apiVersion: v1
kind: Secret
metadata:
  name: catalog-db-secret
  namespace: library
  labels:
    app: catalog-api
type: Opaque
stringData:
  DB_USER: catalog_ro
  DB_PASSWORD: demo-only-Shelf42
