# BROKEN ON PURPOSE - backend starts before Postgres is ready
# Run from the project root:
#   docker compose -f troubleshooting/broken-1-no-db-healthcheck.yml --project-directory . up --build
name: lib-ts1

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - catalog-data:/var/lib/postgresql/data
    networks: [data]
    restart: unless-stopped

  backend:
    build: ./backend
    image: lib-bookshelf-backend
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      - db          # BUG: only waits for the container to START, not for Postgres to be ready
    networks: [data, app]
    restart: "no"   # so the crash stays visible instead of being hidden by a restart

  frontend:
    build: ./frontend
    image: lib-bookshelf-frontend
    ports:
      - "${FRONTEND_PORT:-18080}:80"
    depends_on:
      - backend
    networks: [app]
    restart: unless-stopped

networks:
  app:    # frontend <-> backend
  data:   # backend <-> db; the frontend cannot reach the database

volumes:
  catalog-data:
