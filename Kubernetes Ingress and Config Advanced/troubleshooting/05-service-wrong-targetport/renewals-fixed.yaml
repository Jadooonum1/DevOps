# FIXED: targetPort matches the container port.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: renewals
  namespace: library
  labels:
    app: renewals
spec:
  replicas: 1
  selector:
    matchLabels:
      app: renewals
  template:
    metadata:
      labels:
        app: renewals
    spec:
      containers:
        - name: renewals
          image: hashicorp/http-echo:1.0.0
          args: ["-listen=:5678", "-text=renewals: 2 renewals allowed per loan"]
          ports:
            - containerPort: 5678
---
apiVersion: v1
kind: Service
metadata:
  name: renewals
  namespace: library
spec:
  selector:
    app: renewals
  ports:
    - port: 80
      targetPort: 5678
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: renewals
  namespace: library
spec:
  ingressClassName: nginx
  rules:
    - host: renewals.library.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: renewals
                port:
                  number: 80
