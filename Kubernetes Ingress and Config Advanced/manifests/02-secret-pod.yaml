# Consumes the Secret both ways: one key as an env var, and all keys as files
# on a tmpfs volume with mode 0400. It never prints the secret value itself.
apiVersion: v1
kind: Pod
metadata:
  name: secret-reader
  namespace: library
  labels:
    app: secret-reader
spec:
  containers:
    - name: reader
      image: busybox:1.36
      command: ["sh", "-c"]
      args:
        - |
          echo "client id from env: $PAYMENTS_CLIENT_ID"
          echo "secret file length: $(wc -c < /etc/payments/PAYMENTS_CLIENT_SECRET) bytes"
          ls -lL /etc/payments/    # -L: show the files behind the ..data symlinks
          sleep 3600
      env:
        - name: PAYMENTS_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: payments-credentials
              key: PAYMENTS_CLIENT_ID
      volumeMounts:
        - name: payments
          mountPath: /etc/payments
          readOnly: true
      resources:
        requests: { cpu: 5m, memory: 8Mi }
        limits: { cpu: 50m, memory: 16Mi }
  volumes:
    - name: payments
      secret:
        secretName: payments-credentials
        defaultMode: 0400
