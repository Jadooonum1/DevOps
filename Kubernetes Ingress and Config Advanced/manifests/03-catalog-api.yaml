# Catalogue API, reached through /api on library.local and directly on api.library.local.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-api
  namespace: library
  labels:
    app: catalog-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: catalog-api
  template:
    metadata:
      labels:
        app: catalog-api
    spec:
      containers:
        - name: catalog-api
          image: hashicorp/http-echo:1.0.0
          args: ["-listen=:5678", "-text=catalog-api: 1,482 titles indexed (pod $(POD_NAME))"]
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - name: http
              containerPort: 5678
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 32Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-api
  namespace: library
  labels:
    app: catalog-api
spec:
  selector:
    app: catalog-api
  ports:
    - name: http
      port: 8000
      targetPort: http
