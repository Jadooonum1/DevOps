# Simulates a burst of catalogue searches. Scale replicas to 0 (or delete) to stop the load.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-burst
  namespace: library-hpa
spec:
  replicas: 2
  selector:
    matchLabels:
      app: search-burst
  template:
    metadata:
      labels:
        app: search-burst
    spec:
      containers:
        - name: load
          image: busybox:1.36
          command: ["sh", "-c", "while true; do wget -q -O- http://catalog-api/cgi-bin/search >/dev/null; done"]
          resources:
            requests: { cpu: 10m, memory: 8Mi }
            limits: { cpu: 100m, memory: 32Mi }
