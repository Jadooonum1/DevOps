# Argo CD Application: keep namespace library-gitops identical to the app/ folder in Git.
# Before applying, replace YOUR_GITHUB_USER with the account that hosts this DevOps repo
# and push a branch called gitops-demo (demo commits go there, not to main).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: reader-web
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io   # deleting the Application also deletes what it deployed
spec:
  project: default
  source:
    repoURL: https://github.com/YOUR_GITHUB_USER/DevOps.git
    targetRevision: gitops-demo
    path: Monitoring Observability and GitOps/gitops/gitops-repo/app
  destination:
    server: https://kubernetes.default.svc
    namespace: library-gitops
  syncPolicy:
    automated:
      prune: true       # objects removed from Git are removed from the cluster
      selfHeal: true    # manual edits in the cluster are reverted to the Git version
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 1m
