# Argo CD Application: keep namespace library-gitops identical to the app/ folder in Git.
# Source: the in-cluster Git server from gitops/git-server.yaml (repo library-gitops.git,
# whose app/ folder is a copy of gitops-repo/app). To use a GitHub repo instead, set
# repoURL to https://github.com/<user>/<repo>.git, targetRevision to your branch and
# path to the folder holding the manifests (add credentials if the repo is private).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: reader-web
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io   # deleting the Application also deletes what it deployed
spec:
  project: default
  source:
    repoURL: git://git-server.git-server.svc.cluster.local/library-gitops.git
    targetRevision: main
    path: app
  destination:
    server: https://kubernetes.default.svc
    namespace: library-gitops
  syncPolicy:
    automated:
      prune: true       # objects removed from Git are removed from the cluster
      selfHeal: true    # manual edits in the cluster are reverted to the Git version
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 1m
