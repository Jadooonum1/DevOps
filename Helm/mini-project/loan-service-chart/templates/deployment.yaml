apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "loan.fullname" . }}
  labels:
    {{- include "loan.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "loan.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "loan.labels" . | nindent 8 }}
      annotations:
        # Env vars are read only at start, so a config change must roll the Pods.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-u", "/app/server.py"]
          envFrom:
            - configMapRef:
                name: {{ include "loan.fullname" . }}
          ports:
            - name: http
              containerPort: 8080
          {{- if .Values.probes.enabled }}
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 15
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: code
              mountPath: /app
              readOnly: true
      volumes:
        - name: code
          configMap:
            name: {{ include "loan.fullname" . }}
            items:
              - key: server.py
                path: server.py
