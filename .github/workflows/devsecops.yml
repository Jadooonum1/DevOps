name: devsecops (loan-service)

on:
  push:
    branches: [main]
    paths:
      - "DevSecOps Pipeline/**"
      - ".github/workflows/devsecops.yml"
  pull_request:
    paths:
      - "DevSecOps Pipeline/**"
      - ".github/workflows/devsecops.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devsecops-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: "DevSecOps Pipeline"

env:
  APP_DIR: "DevSecOps Pipeline"
  GITLEAKS_IMAGE: zricethezav/gitleaks:v8.30.1
  SEMGREP_VERSION: "1.181.0"

jobs:
  # 1. Secrets: gitleaks CLI in its official container (no licence / token needed)
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: gitleaks (working tree of this project)
        run: |
          docker run --rm -v "$PWD:/src:ro" "$GITLEAKS_IMAGE" \
            dir /src --config /src/.gitleaks.toml --redact --no-banner -v

  # 2. SAST: Bandit (Python-specific) + Semgrep (pattern rules, incl. our own .semgrep.yml)
  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install scanners
        run: pip install bandit==1.9.4 "semgrep==${SEMGREP_VERSION}"
      - name: Bandit
        run: bandit -r loan_service --severity-level low --confidence-level low
      - name: Semgrep
        run: |
          semgrep scan --metrics=off --error \
            --config .semgrep.yml --config p/python --config p/flask loan_service

  # 3. SCA: known-vulnerable dependencies
  sca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: pip-audit
        run: |
          pip install pip-audit==2.10.1
          pip-audit -r requirements.txt --strict --desc

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: "DevSecOps Pipeline/requirements-dev.txt"
      - run: pip install -r requirements-dev.txt
      - run: pytest

  # 4. IaC: misconfigurations in the Dockerfile and Kubernetes manifests
  iac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Trivy config scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: ${{ env.APP_DIR }}
          severity: HIGH,CRITICAL
          exit-code: "1"

  # 5. Build the image only after every gate is green, then scan the image itself
  image:
    needs: [secrets, sast, sca, test, iac]
    runs-on: ubuntu-latest
    env:
      IMAGE: loan-service:${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: docker build -t "$IMAGE" .
      - name: Trivy image scan (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: "1"
      - name: Run hardened container and smoke test
        run: |
          docker run -d --name loan --read-only --cap-drop ALL \
            --security-opt no-new-privileges --tmpfs /data:uid=10001,gid=10001 \
            -p 8080:8080 "$IMAGE"
          for _ in $(seq 1 20); do curl -fsS http://localhost:8080/healthz && break; sleep 1; done
          curl -fsSI http://localhost:8080/healthz | grep -i '^x-content-type-options: nosniff'
          test "$(docker exec loan id -u)" = "10001"
      - name: Summary
        if: always()
        run: |
          {
            echo "### loan-service security gates"
            echo "secrets (gitleaks), SAST (bandit, semgrep), SCA (pip-audit), IaC (trivy config), image (trivy image)"
            echo "image: \`$IMAGE\` (not pushed)"
          } >> "$GITHUB_STEP_SUMMARY"
          docker rm -f loan >/dev/null 2>&1 || true
