# Two containers in one Pod share an emptyDir.
# "stamper" appends a returned-book line every 5s; "librarian" (nginx) serves the file.
apiVersion: v1
kind: Pod
metadata:
  name: returns-log
  namespace: library-storage
  labels:
    app: returns-log
spec:
  volumes:
    - name: shared-log
      emptyDir:
        sizeLimit: 50Mi
  containers:
    - name: stamper
      image: busybox:1.36
      command: ["sh", "-c"]
      args:
        - |
          i=0
          while true; do
            i=$((i+1))
            echo "$(date -u +%H:%M:%S) returned book #$i" >> /data/returns.txt
            sleep 5
          done
      volumeMounts:
        - name: shared-log
          mountPath: /data
      resources:
        requests: { cpu: 10m, memory: 16Mi }
        limits: { cpu: 50m, memory: 32Mi }
    - name: librarian
      image: nginx:1.27-alpine
      ports:
        - containerPort: 80
      volumeMounts:
        - name: shared-log
          mountPath: /usr/share/nginx/html
          readOnly: true
      resources:
        requests: { cpu: 10m, memory: 16Mi }
        limits: { cpu: 100m, memory: 64Mi }
