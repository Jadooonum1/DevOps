apiVersion: apps/v1
kind: Deployment
metadata:
  name: bookshelf
  namespace: library
  labels:
    app: bookshelf
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bookshelf
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: bookshelf
    spec:
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: bookshelf-data
      initContainers:
        # Seed the page only if the volume is empty, then record which Pod started.
        # The boot log grows across restarts, proving the data outlives Pods.
        - name: seed
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              if [ ! -f /data/index.html ]; then
                printf '<h1>Bookshelf</h1><p>Seeded at %s</p>\n' "$(date -u)" > /data/index.html
              fi
              echo "$(date -u +%FT%TZ) started $HOSTNAME" >> /data/boot.log
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests: { cpu: 10m, memory: 8Mi }
            limits: { cpu: 50m, memory: 32Mi }
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: data
              mountPath: /usr/share/nginx/html
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          startupProbe:
            httpGet: { path: /index.html, port: http }
            periodSeconds: 2
            failureThreshold: 15
          livenessProbe:
            httpGet: { path: /index.html, port: http }
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /index.html, port: http }
            periodSeconds: 5
            failureThreshold: 2
